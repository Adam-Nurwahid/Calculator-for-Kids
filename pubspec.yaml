name: calculator_kids
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Fredoka One font — loaded via google_fonts so no .ttf file needs to be
  # bundled manually. On first run it downloads from Google Fonts and caches
  # locally; subsequent runs work fully offline.
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true

  # Register the assets/ directory so all PNG images are accessible
  # via Image.asset('assets/<filename>.png').
  assets:
    - assets/
